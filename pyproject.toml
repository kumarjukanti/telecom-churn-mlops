[project]
name = "telecom-churn-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ravi Jukanti", email = "kumarjukanti@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
telecom-churn-mlops = "telecom_churn_mlops:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
