apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-churn-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telecom-churn-api
  template:
    metadata:
      labels:
        app: telecom-churn-api
    spec:
      containers:
        - name: api
          image: 074839636183.dkr.ecr.us-west-1.amazonaws.com/telecom-churn-api:v1
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"